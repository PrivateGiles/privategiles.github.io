<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PEAK Supplements</title>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --peak-black: #0a0f0d;
            --peak-dark: #141d18;
            --peak-green: #2dd881;
            --peak-green-dark: #1ea05e;
            --peak-green-glow: #2dd88180;
            --peak-emerald: #00ff88;
            --peak-lime: #c8ff00;
            --peak-gray: #8a9b94;
            --peak-light: #e8f5f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--peak-black);
            color: var(--peak-light);
            overflow-x: hidden;
            position: relative;
        }

        /* Atmospheric background */
        .atmosphere {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(45, 216, 129, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(45, 216, 129, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 255, 136, 0.05) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .mountains {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40vh;
            background: linear-gradient(to top, var(--peak-dark) 0%, transparent 100%);
            pointer-events: none;
            z-index: 1;
        }

        .mountains::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100%;
            background: 
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300"><path d="M0,300 L200,50 L400,150 L600,20 L800,120 L1000,80 L1200,200 L1200,300 Z" fill="%23141d18"/></svg>') 
                no-repeat bottom center / cover;
            opacity: 0.6;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 2;
        }

        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--peak-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--peak-green-glow);
            animation: float-particle linear infinite;
        }

        @keyframes float-particle {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(50px);
                opacity: 0;
            }
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
            z-index: 3;
        }

        /* Header */
        header {
            text-align: center;
            padding: 3rem 0 5rem;
            position: relative;
        }

        .logo {
            font-family: 'Teko', sans-serif;
            font-size: 8rem;
            font-weight: 700;
            line-height: 0.9;
            letter-spacing: 8px;
            background: linear-gradient(135deg, var(--peak-emerald) 0%, var(--peak-green) 50%, var(--peak-lime) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 60px var(--peak-green-glow);
            animation: glow-pulse 3s ease-in-out infinite;
            position: relative;
        }

        @keyframes glow-pulse {
            0%, 100% {
                filter: brightness(1) drop-shadow(0 0 20px var(--peak-green));
            }
            50% {
                filter: brightness(1.3) drop-shadow(0 0 40px var(--peak-green));
            }
        }

        .logo::before {
            content: 'PEAK';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, var(--peak-emerald) 0%, var(--peak-green) 50%, var(--peak-lime) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: blur(20px);
            opacity: 0.5;
            z-index: -1;
        }

        .tagline {
            font-family: 'Teko', sans-serif;
            font-size: 2.5rem;
            font-weight: 500;
            color: var(--peak-green);
            letter-spacing: 4px;
            margin-top: 0.5rem;
            text-transform: uppercase;
        }

        /* Main grid */
        .main-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        /* Product section */
        .products-section {
            background: rgba(20, 29, 24, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(45, 216, 129, 0.2);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 
                0 0 60px rgba(45, 216, 129, 0.1),
                inset 0 0 60px rgba(45, 216, 129, 0.03);
        }

        .category {
            margin-bottom: 3rem;
        }

        .category:last-child {
            margin-bottom: 0;
        }

        .category-header {
            font-family: 'Teko', sans-serif;
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--peak-emerald);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid rgba(45, 216, 129, 0.3);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .category-icon {
            font-size: 2rem;
            filter: drop-shadow(0 0 10px var(--peak-green));
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .product-card {
            background: linear-gradient(135deg, rgba(45, 216, 129, 0.08) 0%, rgba(20, 29, 24, 0.6) 100%);
            border: 1px solid rgba(45, 216, 129, 0.3);
            border-radius: 15px;
            padding: 1.5rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, var(--peak-green-glow) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .product-card:hover::before {
            opacity: 1;
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--peak-green);
            box-shadow: 
                0 20px 40px rgba(45, 216, 129, 0.2),
                0 0 40px rgba(45, 216, 129, 0.3),
                inset 0 0 20px rgba(45, 216, 129, 0.1);
        }

        .product-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(45, 216, 129, 0.3), transparent);
            transition: left 0.5s;
        }

        .product-card:hover::after {
            left: 100%;
        }

        .product-name {
            font-family: 'Teko', sans-serif;
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--peak-light);
            margin-bottom: 0.75rem;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        .product-price {
            font-family: 'Teko', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--peak-green);
            text-shadow: 0 0 20px var(--peak-green-glow);
            position: relative;
            z-index: 1;
        }

        /* Order section */
        .order-section {
            background: rgba(20, 29, 24, 0.8);
            backdrop-filter: blur(15px);
            border: 2px solid var(--peak-green);
            border-radius: 20px;
            padding: 2rem;
            position: sticky;
            top: 2rem;
            max-height: calc(100vh - 4rem);
            overflow-y: auto;
            box-shadow: 
                0 0 80px rgba(45, 216, 129, 0.3),
                inset 0 0 40px rgba(45, 216, 129, 0.05);
        }

        .order-header {
            font-family: 'Teko', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            color: var(--peak-emerald);
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 2rem;
            text-transform: uppercase;
            text-shadow: 0 0 30px var(--peak-green-glow);
        }

        .quantity-control {
            background: rgba(45, 216, 129, 0.1);
            border: 1px solid var(--peak-green);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quantity-label {
            font-family: 'Teko', sans-serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--peak-green);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .quantity-buttons {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .qty-btn {
            background: var(--peak-green);
            color: var(--peak-black);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            font-size: 1.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 20px var(--peak-green-glow);
        }

        .qty-btn:hover {
            background: var(--peak-emerald);
            transform: scale(1.1);
            box-shadow: 0 0 30px var(--peak-green);
        }

        .qty-btn:active {
            transform: scale(0.95);
        }

        .qty-value {
            font-family: 'Teko', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--peak-emerald);
            min-width: 50px;
            text-align: center;
            text-shadow: 0 0 20px var(--peak-green-glow);
        }

        .order-list {
            margin-bottom: 2rem;
            min-height: 200px;
        }

        .order-item {
            background: rgba(45, 216, 129, 0.05);
            border: 1px solid rgba(45, 216, 129, 0.2);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideInRight 0.4s ease-out;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .order-item-info {
            flex: 1;
        }

        .order-item-name {
            font-family: 'Teko', sans-serif;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--peak-light);
            margin-bottom: 0.25rem;
            letter-spacing: 1px;
        }

        .order-item-details {
            font-size: 1rem;
            color: var(--peak-green);
        }

        .remove-btn {
            background: rgba(255, 50, 50, 0.2);
            color: #ff5050;
            border: 1px solid #ff5050;
            border-radius: 8px;
            width: 35px;
            height: 35px;
            cursor: pointer;
            font-size: 1.2rem;
            font-weight: 700;
            transition: all 0.3s;
        }

        .remove-btn:hover {
            background: #ff5050;
            color: var(--peak-black);
            transform: rotate(90deg) scale(1.1);
            box-shadow: 0 0 20px rgba(255, 80, 80, 0.5);
        }

        .empty-cart {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--peak-gray);
            font-size: 1.2rem;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }

        .order-total {
            background: linear-gradient(135deg, rgba(45, 216, 129, 0.15) 0%, rgba(45, 216, 129, 0.05) 100%);
            border: 1px solid var(--peak-green);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 1.2rem;
        }

        .total-row.final {
            font-family: 'Teko', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--peak-emerald);
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px solid var(--peak-green);
            text-shadow: 0 0 20px var(--peak-green-glow);
        }

        .checkout-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--peak-green) 0%, var(--peak-emerald) 100%);
            color: var(--peak-black);
            border: none;
            border-radius: 12px;
            padding: 1.5rem;
            font-family: 'Teko', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(45, 216, 129, 0.4);
        }

        .checkout-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .checkout-btn:hover::before {
            width: 400px;
            height: 400px;
        }

        .checkout-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(45, 216, 129, 0.6);
        }

        .checkout-btn:active {
            transform: translateY(-1px);
        }

        .checkout-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .checkout-btn:disabled:hover {
            box-shadow: 0 10px 40px rgba(45, 216, 129, 0.4);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 15, 13, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: rgba(20, 29, 24, 0.95);
            border: 2px solid var(--peak-green);
            border-radius: 20px;
            padding: 3rem;
            max-width: 500px;
            text-align: center;
            animation: scaleUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 100px rgba(45, 216, 129, 0.5);
        }

        @keyframes scaleUp {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-icon {
            font-size: 6rem;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 0 30px var(--peak-green));
            animation: bounce 0.6s ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .modal-title {
            font-family: 'Teko', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            color: var(--peak-emerald);
            letter-spacing: 3px;
            margin-bottom: 1rem;
            text-transform: uppercase;
            text-shadow: 0 0 30px var(--peak-green-glow);
        }

        .modal-text {
            color: var(--peak-light);
            font-size: 1.2rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .modal-btn {
            background: var(--peak-green);
            color: var(--peak-black);
            border: none;
            border-radius: 12px;
            padding: 1rem 3rem;
            font-family: 'Teko', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 30px rgba(45, 216, 129, 0.4);
        }

        .modal-btn:hover {
            background: var(--peak-emerald);
            transform: translateY(-3px);
            box-shadow: 0 8px 40px rgba(45, 216, 129, 0.6);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(20, 29, 24, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--peak-green);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--peak-emerald);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .order-section {
                position: relative;
                top: 0;
                max-height: none;
            }
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 5rem;
            }

            .tagline {
                font-size: 1.5rem;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="atmosphere"></div>
    <div class="mountains"></div>
    <div class="particles" id="particles"></div>

    <div class="container">
        <header>
            <div class="logo">PEAK</div>
            <div class="tagline">Premium Supplements</div>
        </header>

        <div class="main-grid">
            <div class="products-section">
                <!-- Joints -->
                <div class="category">
                    <h2 class="category-header">
                        <span class="category-icon">🌿</span>
                        Weed Joints
                    </h2>
                    <div class="product-grid" id="joints-grid"></div>
                </div>

                <!-- Gummies -->
                <div class="category">
                    <h2 class="category-header">
                        <span class="category-icon">🍃</span>
                        Weed Gummies
                    </h2>
                    <div class="product-grid" id="gummies-grid"></div>
                </div>

                <!-- Miscellaneous -->
                <div class="category">
                    <h2 class="category-header">
                        <span class="category-icon">⚡</span>
                        Miscellaneous
                    </h2>
                    <div class="product-grid" id="misc-grid"></div>
                </div>
            </div>

            <div class="order-section">
                <h2 class="order-header">Current Order</h2>

                <div class="quantity-control">
                    <span class="quantity-label">Quantity</span>
                    <div class="quantity-buttons">
                        <button class="qty-btn" onclick="decreaseQty()">−</button>
                        <span class="qty-value" id="qty">1</span>
                        <button class="qty-btn" onclick="increaseQty()">+</button>
                    </div>
                </div>

                <div class="order-list" id="orderList">
                    <div class="empty-cart">
                        <div class="empty-icon">🏔️</div>
                        <div>Your cart is empty.<br>Add some products to get started.</div>
                    </div>
                </div>

                <div class="order-total" id="orderTotal" style="display: none;">
                    <div class="total-row final">
                        <span>TOTAL:</span>
                        <span id="total">$0</span>
                    </div>
                </div>

                <button class="checkout-btn" id="checkoutBtn" onclick="checkout()" disabled>
                    Complete Order
                </button>
            </div>
        </div>
    </div>

    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="modal-icon">✨</div>
            <h3 class="modal-title">Order Complete!</h3>
            <p class="modal-text">Your order has been successfully processed. Reach new peaks with Peak Supplements!</p>
            <button class="modal-btn" onclick="closeModal()">Continue</button>
        </div>
    </div>

    <script>
        const products = {
            joints: [
                { name: "Emerald Peak", price: 500 },
                { name: "Frosted Peak", price: 700 },
                { name: "Lemon Haze", price: 1000 },
                { name: "Skuttle Kush", price: 1600 },
                { name: "Supreme ZaZa", price: 2000 }
            ],
            gummies: [
                { name: "Frosted Peak", price: 275 },
                { name: "Lemon Haze", price: 350 },
                { name: "Skuttle Kush", price: 500 },
                { name: "Supreme ZaZa", price: 600 }
            ],
            misc: [
                { name: "Hemp Fibers", price: 150 },
                { name: "Peak Energy", price: 900 },
                { name: "Vape Juices", price: 300 },
                { name: "Elf Bars", price: 3500 },
                { name: "Vape Kit", price: 4500 }
            ]
        };

        let cart = [];
        let currentQty = 1;

        // Initialize products
        function initProducts() {
            Object.keys(products).forEach(category => {
                const grid = document.getElementById(`${category}-grid`);
                products[category].forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">$${product.price.toLocaleString()}</div>
                    `;
                    card.onclick = () => addToCart(product);
                    grid.appendChild(card);
                });
            });
        }

        // Quantity controls
        function increaseQty() {
            currentQty++;
            document.getElementById('qty').textContent = currentQty;
        }

        function decreaseQty() {
            if (currentQty > 1) {
                currentQty--;
                document.getElementById('qty').textContent = currentQty;
            }
        }

        // Add to cart
        function addToCart(product) {
            cart.push({
                ...product,
                quantity: currentQty
            });
            currentQty = 1;
            document.getElementById('qty').textContent = currentQty;
            updateCart();
        }

        // Remove from cart
        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCart();
        }

        // Update cart display
        function updateCart() {
            const orderList = document.getElementById('orderList');
            const checkoutBtn = document.getElementById('checkoutBtn');

            if (cart.length === 0) {
                orderList.innerHTML = `
                    <div class="empty-cart">
                        <div class="empty-icon">🏔️</div>
                        <div>Your cart is empty.<br>Add some products to get started.</div>
                    </div>
                `;
                document.getElementById('orderTotal').style.display = 'none';
                checkoutBtn.disabled = true;
                return;
            }

            document.getElementById('orderTotal').style.display = 'block';
            checkoutBtn.disabled = false;

            orderList.innerHTML = cart.map((item, index) => `
                <div class="order-item">
                    <div class="order-item-info">
                        <div class="order-item-name">${item.name}</div>
                        <div class="order-item-details">x${item.quantity} · $${(item.price * item.quantity).toLocaleString()}</div>
                    </div>
                    <button class="remove-btn" onclick="removeFromCart(${index})">×</button>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            document.getElementById('total').textContent = `$${total.toLocaleString()}`;
        }

        // Checkout
        function checkout() {
            document.getElementById('successModal').classList.add('active');
            cart = [];
            updateCart();
        }

        // Close modal
        function closeModal() {
            document.getElementById('successModal').classList.remove('active');
        }

        // Create floating particles
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(particle);
            }
        }

        // Initialize
        initProducts();
        createParticles();
    </script>
</body>
</html>
